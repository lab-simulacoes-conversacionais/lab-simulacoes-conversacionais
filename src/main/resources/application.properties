spring.application.name=lab-simulacoes-conversacionais

# Sem perfil informado, a aplicação usa o ambiente local. As VMs definem SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=local

# O esquema é só do Flyway: o Hibernate confere, mas nunca altera.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# As migrations têm data e hora no nome. Por isso, uma branch mesclada depois pode trazer uma
# migration mais antiga que a última aplicada, e ela precisa rodar mesmo assim.
spring.flyway.out-of-order=true
# Ao reverter para a imagem anterior, o banco tem migrations que essa imagem não conhece (RNF-12).
spring.flyway.ignore-migration-patterns=*:future

# Evento cujo ouvinte falhou ou foi interrompido volta a ser entregue quando a aplicação reinicia.
spring.modulith.events.republish-outstanding-events-on-restart=true

# Primeiro administrador do sistema. Sem os dois valores, nenhum é criado (ver README).
lab.administrador-inicial.email=${ADMIN_INICIAL_EMAIL:}
lab.administrador-inicial.senha=${ADMIN_INICIAL_SENHA:}

management.endpoints.web.exposure.include=health

# Catálogo da BNCC (RF-05). A importação roda a cada subida e não duplica nada; os testes a desligam.
bncc.importar-ao-iniciar=${BNCC_IMPORTAR_AO_INICIAR:true}
bncc.busca.limite-padrao=50
# O importador limpa o cache ao terminar; a validade é só uma garantia a mais.
bncc.cache.validade=24h
spring.cache.type=redis

# Estado da sessão em andamento no Redis (RNF-04). A validade recomeça a cada interação, então a chave
# some algumas horas depois que a sessão é encerrada ou fica parada; o estado é refeito do banco.
sessoes.estado.validade=6h

# Modelo da OpenAI usado pelo Adaptador de IA (RNF-02: trocar de modelo exige só configuração).
# Definido pelo comparativo da issue #14 (ver docs/spikes/comparativo-modelos/resultados.md). São as
# chaves da autoconfiguração do Spring AI, para o modelo e o esforço medidos valerem sem código extra.
# O esforço faz parte da decisão: outro valor muda a latência medida.
spring.ai.openai.chat.options.model=${IA_MODELO:gpt-6.1-terra}
spring.ai.openai.chat.options.reasoning-effort=low
# O Spring AI manda temperatura 0.7 por padrão, e os modelos de raciocínio só aceitam 1 (HTTP 400 com
# qualquer outro valor). É também o valor com que o comparativo mediu.
spring.ai.openai.chat.options.temperature=1
# Sem isto o streaming não traz os tokens consumidos, que entram nos metadados (RNF-10, RNF-13).
spring.ai.openai.chat.options.stream-usage=true
spring.ai.openai.moderation.options.model=omni-moderation-latest
# Nome gravado nos metadados de cada resposta (RNF-10). Troque junto com o starter do Spring AI.
ia.provedor=openai
# Preço do modelo em dólares por 1 milhão de tokens, para o custo de cada resposta (RNF-13). O padrão é a
# tarifa do gpt-6.1-terra (docs/spikes/comparativo-modelos). Ao trocar IA_MODELO, troque os preços junto.
ia.preco.entrada-por-milhao=${IA_PRECO_ENTRADA:1.00}
ia.preco.saida-por-milhao=${IA_PRECO_SAIDA:5.00}
# Sem valor padrão: no perfil prod, a aplicação não sobe sem a chave. O perfil local tem um provisório.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
# O adaptador só usa conversa e moderação; os outros modelos ficam desligados.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
# O padrão do Spring AI tenta 10 vezes com espera de até 3 minutos, o que travaria a aula. Uma nova
# tentativa rápida basta; depois disso, o erro chega ao professor.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=2s

# Tempo sem atividade até a sessão expirar (RNF-09). O padrão é maior que uma hora-aula de 50 minutos
# (RN-17), para o login não cair durante a parte expositiva da aula. A menor unidade é o minuto.
server.servlet.session.timeout=${SESSAO_INATIVIDADE:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
