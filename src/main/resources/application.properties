spring.application.name=lab-simulacoes-conversacionais

# Sem perfil informado, a aplicação usa o ambiente local. As VMs definem SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=local

# O esquema é só do Flyway: o Hibernate confere, mas nunca altera.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# As migrations têm data e hora no nome. Por isso, uma branch mesclada depois pode trazer uma
# migration mais antiga que a última aplicada, e ela precisa rodar mesmo assim.
spring.flyway.out-of-order=true
# Ao reverter para a imagem anterior, o banco tem migrations que essa imagem não conhece (RNF-12).
spring.flyway.ignore-migration-patterns=*:future

# Evento cujo ouvinte falhou ou foi interrompido volta a ser entregue quando a aplicação reinicia.
spring.modulith.events.republish-outstanding-events-on-restart=true

# Primeiro administrador do sistema. Sem os dois valores, nenhum é criado (ver README).
lab.administrador-inicial.email=${ADMIN_INICIAL_EMAIL:}
lab.administrador-inicial.senha=${ADMIN_INICIAL_SENHA:}

management.endpoints.web.exposure.include=health

# Catálogo da BNCC (RF-05). A importação roda a cada subida e não duplica nada; os testes a desligam.
bncc.importar-ao-iniciar=${BNCC_IMPORTAR_AO_INICIAR:true}
bncc.busca.limite-padrao=50
# O importador limpa o cache ao terminar; a validade é só uma garantia a mais.
bncc.cache.validade=24h
spring.cache.type=redis

# Modelo da OpenAI usado pelo Adaptador de IA (RNF-02: trocar de modelo exige só configuração).
# Definido pelo comparativo da issue #14 (ver docs/spikes/comparativo-modelos/resultados.md). São as
# chaves da autoconfiguração do Spring AI, para o modelo e o esforço medidos valerem sem código extra.
# O esforço faz parte da decisão: outro valor muda a latência medida.
spring.ai.openai.chat.options.model=${IA_MODELO:gpt-6.1-terra}
spring.ai.openai.chat.options.reasoning-effort=low

# Tempo sem atividade até a sessão expirar (RNF-09). O padrão é maior que uma hora-aula de 50 minutos
# (RN-17), para o login não cair durante a parte expositiva da aula. A menor unidade é o minuto.
server.servlet.session.timeout=${SESSAO_INATIVIDADE:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
