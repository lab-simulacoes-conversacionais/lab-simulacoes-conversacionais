spring.application.name=lab-simulacoes-conversacionais

# Sem perfil informado, a aplicação usa o ambiente local. As VMs definem SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=local

# O esquema é só do Flyway: o Hibernate confere, mas nunca altera.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# As migrations têm data e hora no nome. Por isso, uma branch mesclada depois pode trazer uma
# migration mais antiga que a última aplicada, e ela precisa rodar mesmo assim.
spring.flyway.out-of-order=true
# Ao reverter para a imagem anterior, o banco tem migrations que essa imagem não conhece (RNF-12).
spring.flyway.ignore-migration-patterns=*:future

# Evento cujo ouvinte falhou ou foi interrompido volta a ser entregue quando a aplicação reinicia.
spring.modulith.events.republish-outstanding-events-on-restart=true

# Primeiro administrador do sistema. Sem os dois valores, nenhum é criado (ver README).
lab.administrador-inicial.email=${ADMIN_INICIAL_EMAIL:}
lab.administrador-inicial.senha=${ADMIN_INICIAL_SENHA:}

management.endpoints.web.exposure.include=health

# Catálogo da BNCC (RF-05). A importação roda a cada subida e não duplica nada; os testes a desligam.
bncc.importar-ao-iniciar=${BNCC_IMPORTAR_AO_INICIAR:true}
bncc.busca.limite-padrao=50
# O importador limpa o cache ao terminar; a validade é só uma garantia a mais.
bncc.cache.validade=24h
spring.cache.type=redis

# Estado da sessão em andamento no Redis (RNF-04). A validade recomeça a cada interação, então a chave
# some algumas horas depois que a sessão é encerrada ou fica parada; o estado é refeito do banco.
sessoes.estado.validade=6h

# Pedidos de sugestão de cenário por usuário (RNF-13): cada pedido gasta tokens do provedor.
cenarios.sugestao.pedidos-por-janela=10
cenarios.sugestao.janela=1h

# Modelo da OpenAI usado pelo Adaptador de IA (RNF-02: trocar de modelo exige só configuração).
# Definido pelo comparativo da issue #14 (ver docs/spikes/comparativo-modelos/resultados.md). São as
# chaves da autoconfiguração do Spring AI, para o modelo e o esforço medidos valerem sem código extra.
# O esforço e o nível de serviço fazem parte da decisão: outro valor muda a latência medida.
spring.ai.openai.chat.options.model=${IA_MODELO_CHAT:gpt-6.1-terra}
# Esforço none e nível de serviço prioritário: com eles a primeira frase aprovada chega à tela em até
# 3 s (RNF-03), o que o low no nível padrão não cumpria (issue #80, docs/spikes/primeira-frase-aprovada,
# resultados06). O gpt-6.1-terra recusa minimal. O prioritário custa o dobro: veja os preços abaixo.
spring.ai.openai.chat.options.reasoning-effort=none
spring.ai.openai.chat.options.service-tier=priority
# O Spring AI manda temperatura 0.7 por padrão, e os modelos de raciocínio só aceitam 1 (HTTP 400 com
# qualquer outro valor). É também o valor com que o comparativo mediu.
spring.ai.openai.chat.options.temperature=1
# Sem isto o streaming não traz os tokens consumidos, que entram nos metadados (RNF-10, RNF-13).
spring.ai.openai.chat.options.stream-usage=true
spring.ai.openai.moderation.options.model=omni-moderation-latest
# Nome gravado nos metadados de cada resposta (RNF-10). Troque junto com o starter do Spring AI.
ia.provedor=openai
# Versões dos prompts, em src/main/resources/prompts (RNF-11). Versão publicada não se edita: para mudar
# o texto, crie o arquivo da próxima versão e troque aqui. Sem o arquivo, a aplicação não sobe.
ia.prompt.personagem=personagem-v1
ia.prompt.sugestao=sugestao-v1
# Opções do modelo só para a sugestão de cenário, separadas das da fala do personagem. A fala precisa
# de latência baixa na sala (RNF-03); a sugestão é um rascunho que o professor espera alguns segundos,
# então raciocina mais e usa o nível de serviço padrão, que custa menos que o prioritário (RNF-13).
# IA_MODELO_SUGESTAO precisa ser definida, ou a sugestão de cenário não roda: a aplicação sobe com ela
# desligada, avisa no log, e o chat continua funcionando.
ia.sugestao.modelo=${IA_MODELO_SUGESTAO:}
ia.sugestao.reasoning-effort=low
ia.sugestao.service-tier=default
# Teto de tokens de saída, contando o raciocínio do modelo (RNF-13). Um roteiro cortado no teto não
# vira JSON válido e chega como falha do provedor, com o consumo registrado.
ia.sugestao.max-tokens=4000
# Preço do modelo em dólares por 1 milhão de tokens, para o custo de cada resposta (RNF-13). O padrão é a
# tarifa do gpt-6.1-terra no nível prioritário, o dobro da padrão (US$ 1,00 e 5,00), conferida na página
# de preços da OpenAI em 19/11/2026. Ao trocar IA_MODELO_CHAT, IA_MODELO_SUGESTAO ou o nível de serviço,
# troque os preços junto: a tabela é uma só para os dois.
ia.preco.entrada-por-milhao=${IA_PRECO_ENTRADA:2.00}
ia.preco.saida-por-milhao=${IA_PRECO_SAIDA:10.00}
# Abre a conexão com o provedor de IA ao subir, com uma moderação (não gasta tokens), para a primeira
# pergunta da aula não pagar o handshake (RNF-03).
ia.aquecimento.habilitado=${IA_AQUECIMENTO:true}
# Sem valor padrão: no perfil prod, a aplicação não sobe sem a chave. O perfil local tem um provisório.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
# O adaptador só usa conversa e moderação; os outros modelos ficam desligados.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
# O padrão do Spring AI tenta 10 vezes com espera de até 3 minutos, o que travaria a aula. Uma nova
# tentativa rápida basta; depois disso, o erro chega ao professor.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=2s
# Tempo máximo sem receber dados do provedor de IA. Sem ele, uma chamada presa seguraria a resposta do
# personagem sem prazo. Não é a duração total: o streaming que continua mandando trechos não é cortado.
# São 30 s porque a sugestão de cenário (RF-07) não usa streaming e chega toda no fim. Só o Spring AI
# usa estes clientes HTTP. A leitura do reactiveclient vale para o streaming e a do client para as
# demais chamadas. As duas dividem uma conexão só com o provedor (ConexaoComOProvedor), e por isso o
# tempo de conexão das duas é o do client.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s
spring.http.reactiveclient.read-timeout=30s

# Tempo sem atividade até a sessão expirar (RNF-09). O padrão é maior que uma hora-aula de 50 minutos
# (RN-17), para o login não cair durante a parte expositiva da aula. A menor unidade é o minuto.
server.servlet.session.timeout=${SESSAO_INATIVIDADE:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
