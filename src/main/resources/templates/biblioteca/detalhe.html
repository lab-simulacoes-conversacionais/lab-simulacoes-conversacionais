<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabeca(${conteudo.titulo} + ' · Biblioteca')}"></head>
<body>
<div th:replace="~{fragmentos/base :: topo(${email}, ${perfis})}"></div>

<!--
  Detalhe de um cenário da biblioteca (RF-12): a versão aprovada vigente, como no protótipo. O curador
  também abre o histórico de versões (RF-11) e arquiva o cenário (RF-13), depois de confirmar num diálogo:
  o cenário sai da biblioteca, mas o histórico fica guardado (RN-09).
-->
<main class="page detail-page">
  <a class="back-link" th:href="@{/biblioteca}">Voltar à biblioteca</a>
  <div class="library-heading">
    <div>
      <div class="heading-badges">
        <span class="subject-tag" th:text="${conteudo.componente}">História</span>
        <span class="badge badge-positive"><span aria-hidden="true">✓</span>Aprovado</span>
      </div>
      <h1 th:text="${conteudo.titulo}">Título</h1>
      <p th:text="|${conteudo.resumoCurricular()} · aprovado em ${aprovadaEm}|">8º ano · EF08HI03</p>
    </div>
    <div class="heading-actions">
      <th:block th:if="${curador}">
        <a class="btn btn-ghost" th:href="@{/cenarios/{id}/versoes(id=${cenarioId})}">Histórico de versões</a>
        <button class="btn btn-secondary" type="button" data-abrir-dialogo="arquivamento">Arquivar</button>
      </th:block>
      <a class="btn btn-primary" th:if="${professor}" th:href="@{/sessoes/nova(cenario=${cenarioId})}">
        <svg th:replace="~{fragmentos/base :: iconePlay}"></svg> Usar em sala
      </a>
    </div>
  </div>

  <div th:replace="~{cenarios/fragmentos :: conteudo(${conteudo}, 1)}"></div>

  <dialog class="modal" id="arquivamento" aria-labelledby="arquivamento-titulo" th:if="${curador}" data-dialogo>
    <form method="post" th:action="@{/curadoria/{id}/arquivar(id=${cenarioId})}">
      <div class="modal-head">
        <h2 id="arquivamento-titulo">Arquivar cenário</h2>
        <button class="icon-button" type="button" data-fechar aria-label="Fechar">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-intro">
          “<strong th:text="${conteudo.titulo}">Título</strong>” sai da biblioteca e não poderá mais ser usado
          em sala. O histórico de versões continua guardado.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" type="button" data-fechar>Cancelar</button>
        <button class="btn btn-danger" type="submit">Arquivar cenário</button>
      </div>
    </form>
  </dialog>
</main>
<script th:if="${curador}" th:src="@{/js/dialogo.js}" defer></script>
</body>
</html>
