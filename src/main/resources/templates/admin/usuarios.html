<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabeca('Usuários · Administração')}"></head>
<body>
<div th:replace="~{fragmentos/base :: topo(${email}, ${perfis})}"></div>

<main class="page admin-page">
  <div th:replace="~{fragmentos/base :: painelAdmin('usuarios')}"></div>

  <div class="admin-section-head">
    <div>
      <h2>Usuários profissionais</h2>
      <p>Uma pessoa pode acumular mais de um perfil.</p>
    </div>
    <a class="btn btn-primary" th:href="@{/admin/usuarios/novo}">Adicionar usuário</a>
  </div>

  <p th:if="${sucesso}" class="success-notice" role="status"><span aria-hidden="true">✓</span> <span th:text="${sucesso}">ok</span></p>
  <p th:if="${erro}" class="field-error" role="alert" th:text="${erro}">erro</p>

  <section class="card table-card admin-users">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Usuário</th><th>Perfis acumuláveis</th><th>Status</th><th>Ação</th></tr></thead>
        <tbody>
          <tr th:each="usuario : ${usuarios}">
            <td><strong th:text="${usuario.nome}">Nome</strong><small th:text="${usuario.email}">email</small></td>
            <td>
              <!-- Marcar ou desmarcar um perfil já salva, como no protótipo; sem JavaScript, há o botão. -->
              <form th:action="@{'/admin/usuarios/' + ${usuario.id} + '/perfis'}" method="post">
                <div class="role-options">
                  <label th:each="opcao : ${opcoesDePerfil}">
                    <input type="checkbox" name="perfis" onchange="this.form.requestSubmit()"
                           th:value="${opcao.valor}" th:checked="${usuario.perfis.contains(opcao.valor)}">
                    <span aria-hidden="true">✓</span><th:block th:text="${opcao.nome}">Perfil</th:block>
                  </label>
                </div>
                <noscript><button class="btn btn-ghost" type="submit">Salvar perfis</button></noscript>
              </form>
            </td>
            <td>
              <span class="user-status" th:classappend="${usuario.ativo} ? 'active'">
                <i></i><span th:text="${usuario.ativo} ? 'Ativo' : 'Desativado'">Ativo</span>
              </span>
            </td>
            <td>
              <form th:if="${usuario.ativo}" th:action="@{'/admin/usuarios/' + ${usuario.id} + '/desativar'}" method="post">
                <button class="btn btn-ghost" type="submit">Desativar</button>
              </form>
              <form th:unless="${usuario.ativo}" th:action="@{'/admin/usuarios/' + ${usuario.id} + '/ativar'}" method="post">
                <button class="btn btn-secondary" type="submit">Ativar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
