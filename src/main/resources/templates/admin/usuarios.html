<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabeca('Usuários · Administração')}"></head>
<body th:hx-headers='|{"X-CSRF-TOKEN": "${_csrf.token}"}|'>
<div th:replace="~{fragmentos/base :: topo(${email}, ${perfis})}"></div>

<main class="page admin-page">
  <a class="back-link" th:href="@{/}">← Voltar ao início</a>
  <div class="library-heading">
    <div>
      <p class="eyebrow">ADMINISTRAÇÃO</p>
      <h1>Usuários profissionais</h1>
      <p>Uma pessoa pode acumular mais de um perfil (RN-36).</p>
    </div>
    <a class="btn btn-primary" th:href="@{/admin/usuarios/novo}">Adicionar usuário <span aria-hidden="true">+</span></a>
  </div>

  <div th:replace="~{fragmentos/base :: abasAdmin('usuarios')}"></div>

  <p th:if="${sucesso}" class="success-notice" role="status"><span aria-hidden="true">✓</span> <span th:text="${sucesso}">ok</span></p>
  <p th:if="${erro}" class="field-error" role="alert" th:text="${erro}">erro</p>

  <section class="card table-card admin-users">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Usuário</th><th>Perfis acumuláveis</th><th>Status</th><th>Ação</th></tr></thead>
        <tbody>
          <tr th:each="usuario : ${usuarios}">
            <td><strong th:text="${usuario.nome}">Nome</strong><small th:text="${usuario.email}">email</small></td>
            <td>
              <form th:action="@{'/admin/usuarios/' + ${usuario.id} + '/perfis'}" method="post">
                <div class="role-options">
                  <label th:each="p : ${perfisDisponiveis}"
                         th:with="rotulo=${p.name() == 'PROFESSOR' ? 'Professor' : (p.name() == 'CURADOR' ? 'Curador' : 'Administrador')}">
                    <input type="checkbox" name="perfis" th:value="${p}" th:checked="${usuario.perfis.contains(p)}">
                    <span aria-hidden="true">✓</span><span th:text="${rotulo}">Perfil</span>
                  </label>
                </div>
                <button class="btn btn-ghost btn-mini" type="submit">Salvar perfis</button>
              </form>
            </td>
            <td>
              <span class="user-status" th:classappend="${usuario.ativo} ? 'active'">
                <i></i><span th:text="${usuario.ativo} ? 'Ativo' : 'Desativado'">Ativo</span>
              </span>
            </td>
            <td>
              <form th:if="${usuario.ativo}" th:action="@{'/admin/usuarios/' + ${usuario.id} + '/desativar'}" method="post">
                <button class="btn btn-ghost btn-mini" type="submit">Desativar</button>
              </form>
              <form th:unless="${usuario.ativo}" th:action="@{'/admin/usuarios/' + ${usuario.id} + '/ativar'}" method="post">
                <button class="btn btn-secondary btn-mini" type="submit">Ativar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
