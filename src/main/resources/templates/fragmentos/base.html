<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeca(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo}">Laboratório de Simulações Conversacionais</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- Cabeçalho comum das telas dos profissionais: marca, perfis de quem entrou, e-mail e saída. -->
<header th:fragment="topo(email, perfis)">
  <div class="header">
    <a class="brand" th:href="@{/}" aria-label="Ir para o início">
      <span class="brand-mark"><span></span></span>
      <span><strong>Laboratório</strong><small>Simulações Conversacionais</small></span>
    </a>
    <div class="header-actions">
      <span class="profile-chips">
        <span class="subject-tag" th:each="p : ${perfis}" th:text="${p}">Perfil</span>
      </span>
      <span class="user-email" th:text="${email}">pessoa@escola.edu.br</span>
      <form th:action="@{/logout}" method="post" class="logout-form">
        <button class="btn btn-ghost" type="submit">Sair</button>
      </form>
      <span class="avatar" aria-hidden="true"
            th:text="${#strings.toUpperCase(#strings.substring(email, 0, 1))}">A</span>
    </div>
  </div>
  <div class="security-notice">
    <span aria-hidden="true">i</span>
    Personagem simulado por Inteligência Artificial · pode conter erros
  </div>
</header>
</body>
</html>
