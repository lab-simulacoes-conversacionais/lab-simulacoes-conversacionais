<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeca(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo}">Laboratório de Simulações Conversacionais</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- Cabeçalho comum das telas dos profissionais: marca, perfis de quem entrou, e-mail e saída. -->
<header th:fragment="topo(email, perfis)">
  <div class="header">
    <a class="brand" th:href="@{/}" aria-label="Ir para o início">
      <span class="brand-mark"><span></span></span>
      <span><strong>Laboratório</strong><small>Simulações Conversacionais</small></span>
    </a>
    <div class="header-actions">
      <span class="profile-chips">
        <span class="subject-tag" th:each="p : ${perfis}" th:text="${p}">Perfil</span>
      </span>
      <span class="user-email" th:text="${email}">pessoa@escola.edu.br</span>
      <form th:action="@{/logout}" method="post" class="logout-form">
        <button class="btn btn-ghost" type="submit">Sair</button>
      </form>
      <span class="avatar" aria-hidden="true"
            th:text="${#strings.toUpperCase(#strings.substring(email, 0, 1))}">A</span>
    </div>
  </div>
  <div class="security-notice">
    <span aria-hidden="true">i</span>
    Personagem simulado por Inteligência Artificial · pode conter erros
  </div>
</header>

<!--
  Título e abas da área de administração, iguais em todas as abas, como no protótipo.
  'ativa' é 'usuarios', 'turmas' ou 'parametros'. O log de auditoria ganha a sua aba quando a tela existir.
-->
<div th:fragment="painelAdmin(ativa)">
  <div class="library-heading">
    <div>
      <p class="eyebrow">ADMINISTRAÇÃO</p>
      <h1>Configurações da plataforma</h1>
      <p>Gerencie acessos e parâmetros globais com rastreabilidade.</p>
    </div>
    <span class="badge badge-positive"><span aria-hidden="true">✓</span>Ativa</span>
  </div>
  <nav class="admin-tabs" aria-label="Seções da administração">
    <a th:href="@{/admin/usuarios}" th:classappend="${ativa == 'usuarios'} ? 'active'"
       th:attr="aria-current=${ativa == 'usuarios'} ? 'page' : null">Usuários</a>
    <a th:href="@{/admin/turmas}" th:classappend="${ativa == 'turmas'} ? 'active'"
       th:attr="aria-current=${ativa == 'turmas'} ? 'page' : null">Turmas</a>
    <a th:href="@{/admin/parametros}" th:classappend="${ativa == 'parametros'} ? 'active'"
       th:attr="aria-current=${ativa == 'parametros'} ? 'page' : null">Parâmetros</a>
  </nav>
</div>

<!--
  HTMX servido pela aplicação (WebJar no pom.xml), sem CDN. A tela que o usa também declara o
  cabeçalho X-CSRF-TOKEN no <body>, como explica o README.
-->
<script th:fragment="htmx" th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>

<!-- Ícone de confirmação (check) usado nas telas de cadastro concluído. -->
<svg th:fragment="iconeCheck" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
</body>
</html>
