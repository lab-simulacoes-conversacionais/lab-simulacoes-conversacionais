# Perfil das VMs de homologação e do piloto. Sem valores padrão de propósito, para nunca usar as
# credenciais locais fora da máquina de quem desenvolve. Sem DB_URL ou sem REDIS_PORT a aplicação não
# sobe, porque o cache do catálogo da BNCC configura o Redis na subida. Ela também não sobe com o Redis
# fora do ar, porque a importação do catálogo limpa esse cache ao terminar; o compose só inicia a
# aplicação depois que o Redis responde. Com BNCC_IMPORTAR_AO_INICIAR=false, o Redis fora do ar só
# falha no primeiro uso, e /actuator/health fica DOWN.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

management.endpoint.health.show-details=never

# O HTTPS termina no Caddy (RNF-09). A aplicação precisa ler os cabeçalhos X-Forwarded-* para saber
# que a requisição veio por HTTPS, e o cookie de sessão só trafega por HTTPS. O Caddy é o único que
# alcança a porta 8080 e sobrescreve esses cabeçalhos, então o cliente não consegue forjá-los.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
