name: Deploy

# Chamado pelo CI depois que a imagem é publicada, ou manualmente para colocar uma tag no piloto.
on:
  workflow_call:
    inputs:
      ambiente:
        type: string
        required: true
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da entrega para colocar no piloto (exemplo v0.2)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pela tela do GitHub só existe o piloto: homologação recebe cada merge na main.
    # No piloto, o job fica parado aqui até um revisor do Environment aprovar.
    environment: ${{ inputs.ambiente || 'piloto' }}
    # Mesmo grupo do rollback.yml, para nunca haver duas trocas de versão no mesmo ambiente.
    concurrency:
      group: deploy-${{ inputs.ambiente || 'piloto' }}
      cancel-in-progress: false
    env:
      AMBIENTE: ${{ inputs.ambiente || 'piloto' }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if [[ "$AMBIENTE" == piloto ]]; then
            padrao='^v[0-9]+(\.[0-9]+)*$'
          else
            padrao='^(v[0-9]+(\.[0-9]+)*|sha-[0-9a-f]{7,40})$'
          fi
          [[ "$TAG" =~ $padrao ]] || { echo "::error::Tag inválida para $AMBIENTE: $TAG"; exit 1; }

      # Os scripts e o compose vão para a VM na versão da tag implantada.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' \
            'Host vm' \
            "  HostName $DEPLOY_HOST" \
            '  User deploy' \
            '  IdentityFile ~/.ssh/deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            > ~/.ssh/config

      - name: Copy scripts and compose to the VM
        run: tar -czf - infra/docker-compose.yml scripts | ssh vm tar -xzf - -C /opt/poc23/"$AMBIENTE"

      - name: Back up the database
        if: env.AMBIENTE == 'piloto'
        run: |
          # shellcheck disable=SC2029 # Expande no runner de propósito, com valores já validados.
          ssh vm /opt/poc23/"$AMBIENTE"/scripts/backup-postgres.sh "$AMBIENTE"

      - name: Deploy
        run: |
          # shellcheck disable=SC2029 # Expande no runner de propósito, com valores já validados.
          ssh vm /opt/poc23/"$AMBIENTE"/scripts/deploy.sh "$AMBIENTE" "$TAG"
