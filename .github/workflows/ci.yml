name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_ORGANIZATION: lab-simulacoes-conversacionais
  SONAR_PROJECT_KEY: lab-simulacoes-conversacionais_lab-simulacoes-conversacionais
  
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Analyze with SonarCloud
        run: >-
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization="${SONAR_ORGANIZATION}"
          -Dsonar.projectKey="${SONAR_PROJECT_KEY}"
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Tentativas de tirar o personagem do papel contra o modelo de verdade (RNF-09, RN-12, RN-15). Gasta
  # tokens, então só chama a OpenAI quando o PR mexe na IA; nos outros PRs o job passa sem rodar nada.
  # Ele não usa filtro de paths no gatilho porque é check obrigatório do merge, e um check obrigatório
  # que não roda deixa o PR esperando para sempre. Pela aba Actions, roda sempre.
  quebra-de-personagem:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # As chamadas são pagas e em streaming: uma conexão presa não pode segurar o check por horas.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AI changes
        id: mudancas
        env:
          EVENTO: ${{ github.event_name }}
          REPO_DO_PR: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ATOR: ${{ github.actor }}
        run: |
          if [[ "$EVENTO" != pull_request ]]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PRs de fork e do Dependabot não recebem o OPENAI_API_KEY; sem pular, o check obrigatório
          # falharia sempre e travaria o merge.
          if [[ "$REPO_DO_PR" != "$REPO" || "$ATOR" == 'dependabot[bot]' ]]; then
            echo "rodar=false" >> "$GITHUB_OUTPUT"
            echo "PR de fork ou do Dependabot: sem acesso ao OPENAI_API_KEY, os testes de quebra de personagem" \
              "não rodaram. Se o PR mexe na IA, rode o workflow pela aba Actions antes do merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Além do módulo ia, tudo de que o teste depende para subir: a infraestrutura de teste, as
          # migrations (o adaptador grava resposta_ia_meta), as configurações, os recursos e o build.
          padrao='^(src/(main|test)/java/br/ufg/inf/labsimulacoes/ia/'
          padrao+='|src/test/java/br/ufg/inf/labsimulacoes/InfraestruturaDeTeste\.java$'
          padrao+='|src/main/resources/(prompts|db/migration)/|src/main/resources/application(-[^/]*)?\.properties$'
          padrao+='|src/test/resources/|pom\.xml$|mvnw$|\.mvn/|\.github/workflows/ci\.yml$)'
          # No PR, o checkout é o merge commit: o primeiro pai é a main com que ele foi mesclado, então a
          # diferença tem só os arquivos do PR, mesmo que a main tenha andado depois do base.sha.
          if git diff --name-only HEAD^1 HEAD | grep -qE "$padrao"; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=false" >> "$GITHUB_OUTPUT"
            echo "O PR não mexe na IA: os testes de quebra de personagem não rodaram." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Java 21
        if: steps.mudancas.outputs.rodar == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run character-break tests
        if: steps.mudancas.outputs.rodar == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Falta o segredo OPENAI_API_KEY no repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          ./mvnw -B test -Dtest=QuebraDePersonagemTest -Dia.teste-quebra=true -Djacoco.skip=true

      # O relatório só é gravado no @AfterAll da classe. Sem ele, a classe não rodou (foi renomeada ou
      # pulada pelas condições) e o check não pode passar como se tivesse testado o personagem.
      - name: Publish report
        if: always() && steps.mudancas.outputs.rodar == 'true'
        run: |
          relatorio=target/quebra-de-personagem/relatorio.md
          if [[ -f "$relatorio" ]]; then
            cat "$relatorio" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "O relatório não foi gerado: nenhum caso rodou. Veja o log do passo anterior." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::O relatório de quebra de personagem não foi gerado; nenhum caso rodou."
            exit 1
          fi

      - name: Upload report
        if: always() && steps.mudancas.outputs.rodar == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quebra-de-personagem
          path: |
            target/quebra-de-personagem/
            target/surefire-reports/
          if-no-files-found: warn

  docker-image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag-sha: ${{ steps.tag-sha.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Read project version
        id: project-version
        run: echo "value=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.project-version.outputs.value }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Mesmo formato da tag type=sha acima, que usa os 7 primeiros caracteres do commit.
      - name: Read commit image tag
        id: tag-sha
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # Os deploys só rodam depois que a VM estiver pronta e a variável DEPLOY_HABILITADO for criada no
  # repositório (docs/operacao/hospedagem.md). Sem ela, a main ficaria vermelha a cada merge.
  deploy-homologacao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HABILITADO == 'true'
    needs: docker-image
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: homologacao
      tag: ${{ needs.docker-image.outputs.tag-sha }}
    secrets: inherit

  deploy-piloto:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_HABILITADO == 'true'
    needs: docker-image
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: piloto
      tag: ${{ github.ref_name }}
    secrets: inherit
