name: Rollback

# Roteiro completo em docs/operacao/reversao.md.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente que vai voltar de versão
        type: choice
        options:
          - piloto
          - homologacao
        required: true
      tag:
        description: Tag de destino. Vazio volta para a versão anterior do histórico
        type: string
        required: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    # No piloto, a reversão também espera a aprovação de um revisor do Environment.
    environment: ${{ inputs.ambiente }}
    # Mesmo grupo do deploy.yml, para nunca haver duas trocas de versão no mesmo ambiente.
    concurrency:
      group: deploy-${{ inputs.ambiente }}
      cancel-in-progress: false
    env:
      AMBIENTE: ${{ inputs.ambiente }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          padrao='^(v[0-9]+(\.[0-9]+)*|sha-[0-9a-f]{7,40})$'
          [[ -z "$TAG" || "$TAG" =~ $padrao ]] || { echo "::error::Tag inválida: $TAG"; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' \
            'Host vm' \
            "  HostName $DEPLOY_HOST" \
            '  User deploy' \
            '  IdentityFile ~/.ssh/deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            > ~/.ssh/config

      - name: Roll back
        run: |
          # shellcheck disable=SC2029 # Expande no runner de propósito, com valores já validados.
          ssh vm /opt/poc23/"$AMBIENTE"/scripts/rollback.sh "$AMBIENTE" "$TAG"
