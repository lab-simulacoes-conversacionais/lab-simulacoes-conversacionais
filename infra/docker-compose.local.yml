# Sobrepõe o docker-compose.borda.yml para validar o proxy na máquina de quem desenvolve, sem domínio
# nem Let's Encrypt: troca os sites por versões com "tls internal" e usa portas altas.
# Modo de usar em docs/operacao/hospedagem.md, seção "Validação local".
services:
  caddy:
    ports: !override
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./sites-local:/etc/caddy/sites:ro
